name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build is reproducible
        run: |
          npm run build
          git diff --exit-code docs/style.json
      - name: Validate style
        run: npm run validate
